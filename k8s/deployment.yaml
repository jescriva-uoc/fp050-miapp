apiVersion: apps/v1
kind: Deployment
metadata:
  name: miapp
  labels: { app: miapp }
spec:
  replicas: 3
  selector:
    matchLabels: { app: miapp }
  template:
    metadata:
      labels: { app: miapp }
    spec:
      containers:
        - name: miapp
          image: miapp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 3
            periodSeconds: 5
